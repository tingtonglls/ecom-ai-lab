model:
  name: BAAI/bge-reranker-base
  output_dir: model/my-bge-reranker

dataset:
  train_data: dataset/tool_calling_trace/train/intent_train_flagembedding_reranker.jsonl

training:
  epochs: 3
  batch_size: 8
  learning_rate: 1e-5
  gradient_accumulation_steps: 2
  warmup_ratio: 0.1
  weight_decay: 0.01
  save_total_limit: 3
  seed: 42
  fp16: false
  bf16: false
  gradient_checkpointing: false

reranker:
  train_group_size: 8
  query_max_len: 128
  passage_max_len: 256

logging:
  log_dir: outputs/rag/finetune/bge-reranker
  logging_steps: 20
